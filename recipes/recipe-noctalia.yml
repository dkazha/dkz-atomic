---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: dkz-atomic-sway
description: My Noctalia desktop.
base-image: ghcr.io/ublue-os/sericea-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    skip-unavailable: true
    install:
      - noctalia

  - from-file: common-packages.yml
  - from-file: common-flatpaks.yml
  - type: signing
